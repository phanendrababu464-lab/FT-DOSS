version: "3.9"

# FT-DOSS Docker Compose - 3-node cluster simulation
# Demonstrates real distributed behavior: node failure, replication, repair

networks:
  ftdoss-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  node1-data: {}
  node1-wal: {}
  node2-data: {}
  node2-wal: {}
  node3-data: {}
  node3-wal: {}

services:
  # ─── Storage Node 1 (Primary) ─────────────────────────────────────────────
  storage-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftdoss-storage-1
    networks:
      ftdoss-net:
        ipv4_address: 172.20.0.10
    ports:
      - "8080:8080"
      - "9090:9090"  # Prometheus metrics
    environment:
      FTDOSS_NODE_ID: "storage-1"
      FTDOSS_HTTP_PORT: "8080"
      FTDOSS_DATA_DIR: "/data"
      FTDOSS_WAL_DIR: "/wal"
      FTDOSS_ZONE: "zone-1"
      FTDOSS_RACK: "rack-1"
      FTDOSS_ADMIN_API_KEY: "dev-key"
      FTDOSS_PEER_NODES: "storage-2=http://storage-2:8080,storage-3=http://storage-3:8080"
    volumes:
      - node1-data:/data
      - node1-wal:/wal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      - "ftdoss.node=storage-1"
      - "ftdoss.zone=zone-1"

  # ─── Storage Node 2 ───────────────────────────────────────────────────────
  storage-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftdoss-storage-2
    networks:
      ftdoss-net:
        ipv4_address: 172.20.0.11
    ports:
      - "8081:8080"
      - "9091:9090"
    environment:
      FTDOSS_NODE_ID: "storage-2"
      FTDOSS_HTTP_PORT: "8080"
      FTDOSS_DATA_DIR: "/data"
      FTDOSS_WAL_DIR: "/wal"
      FTDOSS_ZONE: "zone-1"
      FTDOSS_RACK: "rack-2"
      FTDOSS_ADMIN_API_KEY: "dev-key"
      FTDOSS_PEER_NODES: "storage-1=http://storage-1:8080,storage-3=http://storage-3:8080"
    volumes:
      - node2-data:/data
      - node2-wal:/wal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      - "ftdoss.node=storage-2"
      - "ftdoss.zone=zone-1"

  # ─── Storage Node 3 ───────────────────────────────────────────────────────
  storage-3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftdoss-storage-3
    networks:
      ftdoss-net:
        ipv4_address: 172.20.0.12
    ports:
      - "8082:8080"
      - "9092:9090"
    environment:
      FTDOSS_NODE_ID: "storage-3"
      FTDOSS_HTTP_PORT: "8080"
      FTDOSS_DATA_DIR: "/data"
      FTDOSS_WAL_DIR: "/wal"
      FTDOSS_ZONE: "zone-2"
      FTDOSS_RACK: "rack-3"
      FTDOSS_ADMIN_API_KEY: "dev-key"
      FTDOSS_PEER_NODES: "storage-1=http://storage-1:8080,storage-2=http://storage-2:8080"
    volumes:
      - node3-data:/data
      - node3-wal:/wal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    labels:
      - "ftdoss.node=storage-3"
      - "ftdoss.zone=zone-2"

  # ─── Dashboard (React Frontend) ───────────────────────────────────────────
  dashboard:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ftdoss-dashboard
    networks:
      - ftdoss-net
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: "http://storage-1:8080"
    depends_on:
      storage-1:
        condition: service_healthy
    restart: unless-stopped

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: ftdoss-prometheus
    networks:
      - ftdoss-net
    ports:
      - "9080:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
